[package]
name = "rsomics-call"
version = "0.1.0"
description = "Typed alignment likelihood and small-variant calling workflow"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-call"
homepage = "https://github.com/omics-rust/rsomics-call"
authors = ["Zane Leong <efd@live.com>"]
categories = ["science"]
keywords = ["bioinformatics", "variant-calling", "genomics", "bam", "vcf"]
readme = "README.md"

[lib]
doctest = false

[dependencies]
noodles = { version = "0.110", features = ["bam", "bgzf", "core", "cram", "fasta", "sam"] }
rsomics-bamio = "0.2"
rsomics-pileup = { version = "0.2", git = "https://github.com/omics-rust/rsomics-pileup", rev = "0d4414364d5958980ba6c4962673ad256580f1ef" }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
