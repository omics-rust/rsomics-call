[package]
name = "rsomics-call"
version = "0.1.0"
description = "Typed alignment likelihood and small-variant calling workflow"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-call"
homepage = "https://github.com/omics-rust/rsomics-call"
authors = ["Zane Leong <efd@live.com>"]
categories = ["science"]
keywords = ["bioinformatics", "variant-calling", "genomics", "bam", "vcf"]
readme = "README.md"

[lib]
doctest = false

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
noodles = { version = "0.110", features = ["bam", "bcf", "bgzf", "core", "cram", "fasta", "sam", "tabix", "vcf"] }
noodles-util = { version = "0.79", features = ["variant"] }
rsomics-bamio = "0.3"
rsomics-pileup = "0.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
